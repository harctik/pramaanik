<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>PRAMAANIK · Anomaly flags</title>
  <meta name="description" content="PRAMAANIK public fund transparency demo: sample anomaly cases.">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="mobileHeader"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <div class="page-head">
      <div>
        <h1>Anomaly flags</h1>
        <p>Sample cases showing the patterns a graph model would raise for a person to review. No model runs in this demo.</p>
      </div>
    </div>
    <div class="card-list" id="flagList"></div>
  </main>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/sidebar.js"></script>
  <script>
const P = PRAMAANIK, ui = P.ui, esc = ui.esc;
P.initPage('admin', 'flags');
const investigating = new Set();

function render() {
  document.getElementById('flagList').innerHTML = P.flags.map(f => {
    const hold = ui.activeHold(f.txId);
    return `
    <article class="panel record">
      <div class="record-head">
        <div><h2 class="text-base">${esc(f.type)}</h2><div class="text-xs muted">${esc(f.id)} · ${esc(f.model)} · ${esc(f.time)}</div></div>
        ${ui.badge(f.severity)}
      </div>
      <p class="text-sm">${esc(f.explanation)}</p>
      ${ui.riskMeter(f.risk)}
      <dl class="fields">
        ${ui.field('Scheme', esc(f.scheme))}
        ${ui.field('Amount', esc(f.amount))}
        ${ui.field('Record', esc(f.txId), true)}
        ${ui.field('Proof (sample)', f.proofVerified ? 'Marked verified' : 'Pending')}
        ${ui.field('Pattern', esc(f.motif))}
      </dl>
      <div class="record-actions">
        <button type="button" class="btn btn-secondary btn-sm" data-investigate="${esc(f.id)}"${investigating.has(f.id) ? ' disabled' : ''}>${investigating.has(f.id) ? 'Under investigation' : 'Investigate'}</button>
        <button type="button" class="btn btn-danger btn-sm" data-hold="${esc(f.id)}"${hold ? ' disabled' : ''}>${hold ? 'On hold (' + esc(hold.id) + ')' : 'Place hold'}</button>
      </div>
    </article>`;
  }).join('');
}

document.getElementById('flagList').addEventListener('click', e => {
  const inv = e.target.closest('[data-investigate]');
  const hold = e.target.closest('[data-hold]');
  if (inv) { investigating.add(inv.dataset.investigate); render(); }
  if (hold) { ui.placeHold(P.getFlagById(hold.dataset.hold), 'Admin (this session)'); render(); }
});

render();
  </script>
</body>
</html>
