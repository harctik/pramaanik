<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>PRAMAANIK · Disbursements</title>
  <meta name="description" content="PRAMAANIK public fund transparency demo: all sample disbursements.">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="mobileHeader"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <div class="page-head">
      <div>
        <h1>Disbursements</h1>
        <p>Every sample record with its stage and GST, bank and location checks.</p>
      </div>
      <button type="button" class="btn btn-primary" id="newBtn">New disbursement</button>
    </div>

    <div class="stat-row" id="stageCounts"></div>

    <section class="panel">
      <div class="overflow-x-auto">
        <table class="data-table" id="disbTable">
          <thead><tr><th>ID</th><th>Scheme and stage</th><th>Amount</th><th>Recipient</th><th>Checks</th><th>Status</th><th>Time</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <div class="modal-overlay" id="newDialog" style="display:none">
      <div class="modal-content dialog-body" role="dialog" aria-modal="true" aria-labelledby="newTitle">
        <div class="dialog-head">
          <h2 id="newTitle" class="text-lg">New disbursement</h2>
          <button type="button" class="icon-btn" data-close aria-label="Close"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
        <form id="newForm">
          <div class="mb-4"><label class="field-label" for="mScheme">Scheme</label><select class="input-base" id="mScheme" required><option value="">Select a scheme</option></select></div>
          <div class="mb-4"><label class="field-label" for="mRecipient">Recipient ID</label><input class="input-base font-mono" id="mRecipient" placeholder="did:polygonid:…" required></div>
          <div class="mb-4"><label class="field-label" for="mAmount">Amount in rupees</label><input class="input-base" type="number" min="1" step="1" id="mAmount" placeholder="2000" required></div>
          <p class="notice mb-4">Demo only. The record stays on this page until you reload. Nothing is sent or written to a blockchain.</p>
          <button type="submit" class="btn btn-primary w-full">Add demo record</button>
        </form>
      </div>
    </div>
  </main>

  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/sidebar.js"></script>
  <script>
const P = PRAMAANIK, ui = P.ui, esc = ui.esc;
P.initPage('admin', 'disbursements');
let demoCount = 0;

function render() {
  const stages = [...new Set(P.disbursements.map(d => d.stage))];
  document.getElementById('stageCounts').innerHTML =
    ui.stat('All records', P.disbursements.length) +
    stages.map(s => ui.stat(ui.stageLabel(s), P.disbursements.filter(d => d.stage === s).length)).join('');
  document.querySelector('#disbTable tbody').innerHTML = P.disbursements.map(d => `
    <tr>
      <td class="font-mono whitespace-nowrap">${esc(d.id)}</td>
      <td style="min-width:200px">${esc(d.scheme)}<div class="text-xs muted mt-1">${esc(ui.stageLabel(d.stage))}</div></td>
      <td class="font-semibold whitespace-nowrap">${esc(d.amount)}</td>
      <td class="font-mono break-all" style="min-width:180px">${esc(d.recipient)}</td>
      <td>${ui.checks(d)}</td>
      <td>${ui.badge(d.status)}</td>
      <td class="whitespace-nowrap">${esc(d.time)}</td>
    </tr>`).join('');
}

const form = document.getElementById('newForm');
ui.fillSchemes(document.getElementById('mScheme'));
ui.wireDialog('newDialog', () => form.reset());
document.getElementById('newBtn').addEventListener('click', () => ui.openDialog('newDialog'));
form.addEventListener('submit', e => {
  e.preventDefault();
  demoCount++;
  P.disbursements.unshift({
    id: 'DEMO-' + String(demoCount).padStart(3, '0'),
    scheme: document.getElementById('mScheme').value,
    stage: 'Sanctioned',
    amount: ui.rupees(Number(document.getElementById('mAmount').value)),
    recipient: document.getElementById('mRecipient').value.trim(),
    time: 'just now', status: 'pending', gst: false, bank: false, geo: false
  });
  ui.closeDialog('newDialog', () => form.reset());
  render();
});

render();
  </script>
</body>
</html>
