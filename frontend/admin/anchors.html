<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>PRAMAANIK · Anchor status</title>
  <meta name="description" content="PRAMAANIK public fund transparency demo: sample anchor records.">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="mobileHeader"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <div class="page-head">
      <div>
        <h1>Anchor status</h1>
        <p>The design publishes a Merkle root of the records to two public test networks, so later edits can be detected.</p>
      </div>
    </div>
    <p class="notice mb-6">The roots, sequence numbers and statuses below are sample values. This page does not query either network.</p>
    <div class="card-list" id="anchorList"></div>
  </main>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/sidebar.js"></script>
  <script>
const P = PRAMAANIK, ui = P.ui, esc = ui.esc;
P.initPage('admin', 'anchors');
document.getElementById('anchorList').innerHTML = P.anchors.map(a => `
  <article class="panel record">
    <div class="record-head">
      <h2 class="text-base">${esc(a.chain)}</h2>
      ${ui.badge(a.status, 'Sample: ' + a.status)}
    </div>
    <dl class="fields">
      ${ui.field('Merkle root', esc(a.root), true)}
      ${ui.field('Sequence', '#' + a.seq.toLocaleString('en-IN'), true)}
      ${ui.field('Recorded', esc(a.time))}
    </dl>
  </article>`).join('');
  </script>
</body>
</html>
