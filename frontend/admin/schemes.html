<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>PRAMAANIK · Schemes</title>
  <meta name="description" content="PRAMAANIK public fund transparency demo: sample schemes and how much has been disbursed.">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="mobileHeader"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <div class="page-head">
      <div>
        <h1>Schemes</h1>
        <p>Sample schemes, their sanctioned budgets and the share disbursed so far. The figures are illustrative.</p>
      </div>
    </div>
    <div class="card-list" id="schemeList"></div>
  </main>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/sidebar.js"></script>
  <script>
const P = PRAMAANIK, ui = P.ui, esc = ui.esc;
P.initPage('admin', 'schemes');
document.getElementById('schemeList').innerHTML = P.schemes.map(s => `
  <article class="panel record">
    <div>
      <h2 class="text-base">${esc(s.name)}</h2>
      <p class="text-xs muted mt-1">${esc(s.ministry)}</p>
    </div>
    <dl class="fields">
      ${ui.field('Budget', esc(s.budget))}
      ${ui.field('Beneficiaries', esc(s.beneficiaries))}
    </dl>
    <div class="bar-row" style="margin-top:auto">
      <span>Disbursed</span><span class="font-mono text-right">${s.disbursedPct}%</span>
      <div class="risk-bar-track"><div class="risk-bar-fill" style="width:${s.disbursedPct}%"></div></div>
    </div>
  </article>`).join('');
  </script>
</body>
</html>
