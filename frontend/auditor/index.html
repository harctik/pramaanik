<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>PRAMAANIK · Auditor dashboard</title>
  <meta name="description" content="PRAMAANIK public fund transparency demo: auditor dashboard with sample data.">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="mobileHeader"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <div class="page-head">
      <div>
        <h1>Auditor dashboard</h1>
        <p>Sample anomaly cases and the disbursements currently on hold.</p>
      </div>
    </div>

    <div class="stat-row" id="stats"></div>

    <div class="split split-even">
      <section class="panel">
        <div class="panel-head"><h2>Anomaly cases</h2><a class="link text-sm" href="flags.html">Investigate</a></div>
        <div class="rows" id="flagList"></div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>On hold</h2><a class="link text-sm" href="frozen.html">Manage holds</a></div>
        <div class="rows" id="holdList"></div>
      </section>
    </div>
  </main>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/sidebar.js"></script>
  <script>
const P = PRAMAANIK, ui = P.ui, esc = ui.esc;
P.initPage('auditor', 'dashboard');

const holds = P.frozen.filter(h => h.status !== 'Released');
document.getElementById('stats').innerHTML = [
  ui.stat('Anomaly cases', P.flags.length),
  ui.stat('Holds', holds.length),
  ui.stat('Value on hold', ui.rupees(holds.reduce((s, h) => s + h.amountRaw, 0))),
  ui.stat('Proofs marked verified', P.flags.filter(f => f.proofVerified).length + ' of ' + P.flags.length, 'sample status')
].join('');

document.getElementById('flagList').innerHTML = P.flags.map(f => `
  <article>
    <div class="record-head mb-2"><strong class="text-sm">${esc(f.type)}</strong>${ui.badge(f.severity)}</div>
    <p class="text-sm mb-3">${esc(f.explanation)}</p>
    ${ui.riskMeter(f.risk)}
    <div class="text-xs muted mt-2">${esc(f.time)} · ${esc(f.amount)}</div>
  </article>`).join('');

document.getElementById('holdList').innerHTML = holds.map(h => `
  <article>
    <div class="record-head mb-2"><strong class="font-mono text-sm">${esc(h.id)}</strong>${ui.badge(h.status)}</div>
    <div class="font-semibold text-sm mb-1">${esc(h.scheme)}</div>
    <p class="text-sm mb-2">${esc(h.reason)}</p>
    <div class="text-xs muted">${esc(h.amount)} · held ${h.daysLocked}d · ${esc(h.frozenBy)}</div>
  </article>`).join('') || '<div class="empty">Nothing is on hold.</div>';
  </script>
</body>
</html>
