<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>PRAMAANIK · Proof records</title>
  <meta name="description" content="PRAMAANIK public fund transparency demo: sample proof records.">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="mobileHeader"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <div class="page-head">
      <div>
        <h1>Proof records</h1>
        <p>The design attaches a zero-knowledge proof of the model's output to each anomaly case.</p>
      </div>
    </div>
    <p class="notice mb-6">No proofs are generated or checked in this demo. The statuses below are sample values.</p>
    <section class="panel">
      <div class="overflow-x-auto">
        <table class="data-table">
          <thead><tr><th>Case</th><th>Model</th><th>Record</th><th>Risk</th><th>Sample status</th><th>Time</th></tr></thead>
          <tbody id="proofRows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/sidebar.js"></script>
  <script>
const P = PRAMAANIK, ui = P.ui, esc = ui.esc;
P.initPage('auditor', 'proofs');
document.getElementById('proofRows').innerHTML = P.flags.map(f => `
  <tr>
    <td class="font-mono whitespace-nowrap">${esc(f.id)}</td>
    <td class="font-mono whitespace-nowrap">${esc(f.model)}</td>
    <td class="font-mono whitespace-nowrap">${esc(f.proof)}</td>
    <td class="font-mono font-semibold" style="color:${ui.riskColor(f.risk)}">${Math.round(f.risk / 100)}%</td>
    <td>${f.proofVerified ? ui.badge('active', 'Marked verified') : ui.badge('pending')}</td>
    <td class="whitespace-nowrap">${esc(f.time)}</td>
  </tr>`).join('');
  </script>
</body>
</html>
