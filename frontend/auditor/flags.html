<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>PRAMAANIK · Investigation</title>
  <meta name="description" content="PRAMAANIK public fund transparency demo: investigate sample anomaly cases.">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="mobileHeader"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <div class="page-head">
      <div>
        <h1>Investigation</h1>
        <p>Open a report to see the pattern and record behind each sample case.</p>
      </div>
    </div>
    <div class="card-list" id="flagList"></div>
  </main>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/sidebar.js"></script>
  <script>
const P = PRAMAANIK, ui = P.ui, esc = ui.esc;
P.initPage('auditor', 'flags');
const open = new Set();

function render() {
  document.getElementById('flagList').innerHTML = P.flags.map(f => {
    const hold = ui.activeHold(f.txId);
    const shown = open.has(f.id);
    return `
    <article class="panel record">
      <div class="record-head">
        <div><h2 class="text-base">${esc(f.type)}</h2><div class="text-xs muted">${esc(f.id)} · ${esc(f.time)}</div></div>
        ${ui.badge(f.severity)}
      </div>
      <p class="text-sm">${esc(f.explanation)}</p>
      ${ui.riskMeter(f.risk)}
      ${shown ? `<dl class="fields">
        ${ui.field('Scheme', esc(f.scheme))}
        ${ui.field('Amount', esc(f.amount))}
        ${ui.field('Model', esc(f.model), true)}
        ${ui.field('Proof (sample)', f.proofVerified ? 'Marked verified' : 'Pending')}
        ${ui.field('Record', esc(f.txId), true)}
        ${ui.field('Pattern', esc(f.motif))}
      </dl>` : ''}
      <div class="record-actions">
        <button type="button" class="btn btn-secondary btn-sm" data-report="${esc(f.id)}" aria-expanded="${shown}">${shown ? 'Hide report' : 'Full report'}</button>
        <button type="button" class="btn btn-danger btn-sm" data-hold="${esc(f.id)}"${hold ? ' disabled' : ''}>${hold ? 'On hold (' + esc(hold.id) + ')' : 'Place hold'}</button>
      </div>
    </article>`;
  }).join('');
}

document.getElementById('flagList').addEventListener('click', e => {
  const report = e.target.closest('[data-report]');
  const hold = e.target.closest('[data-hold]');
  if (report) {
    const id = report.dataset.report;
    if (open.has(id)) open.delete(id); else open.add(id);
    render();
  }
  if (hold) { ui.placeHold(P.getFlagById(hold.dataset.hold), 'Auditor (this session)'); render(); }
});

render();
  </script>
</body>
</html>
