<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>PRAMAANIK · Holds</title>
  <meta name="description" content="PRAMAANIK public fund transparency demo: sample disbursements on hold.">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="mobileHeader"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <div class="page-head">
      <div>
        <h1>Frozen assets</h1>
        <p>In the design, an auditor hold stops a disbursement until it is released. Here, releasing or extending only changes this page and resets on reload.</p>
      </div>
    </div>

    <div class="stat-row" id="stats"></div>

    <div class="split split-wide-right">
      <section class="panel"><div class="rows" id="holdList"></div></section>
      <section class="panel" id="holdDetail" aria-live="polite"></section>
    </div>
  </main>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/sidebar.js"></script>
  <script>
const P = PRAMAANIK, ui = P.ui, esc = ui.esc;
P.initPage('auditor', 'frozen');
let selectedId = P.frozen.length ? P.frozen[0].id : null;

function render() {
  const active = P.frozen.filter(h => h.status !== 'Released');
  const avg = active.length ? active.reduce((s, h) => s + h.daysLocked, 0) / active.length : 0;
  document.getElementById('stats').innerHTML = [
    ui.stat('Holds', active.length, P.frozen.length + ' in total'),
    ui.stat('Value on hold', ui.rupees(active.reduce((s, h) => s + h.amountRaw, 0))),
    ui.stat('Average hold', avg.toFixed(1) + ' days', 'open holds only')
  ].join('');

  document.getElementById('holdList').innerHTML = P.frozen.map(h => `
    <button type="button" class="hold-row text-left w-full" data-select="${esc(h.id)}" aria-pressed="${h.id === selectedId}">
      <span class="record-head mb-2"><span class="font-mono font-semibold text-sm">${esc(h.id)}</span>${ui.badge(h.status)}</span>
      <span class="font-semibold text-sm mb-1" style="display:block">${esc(h.scheme)}</span>
      <span class="text-xs muted">${esc(h.amount)} · held ${h.daysLocked}d</span>
    </button>`).join('') || '<div class="empty">Nothing is on hold.</div>';

  const h = P.frozen.find(x => x.id === selectedId);
  document.getElementById('holdDetail').innerHTML = h ? `
    <div class="panel-head"><h2>${esc(h.id)}</h2>${ui.badge(h.status)}</div>
    <div class="panel-body">
      <dl class="fields mb-4">
        ${ui.field('Scheme', esc(h.scheme))}
        ${ui.field('Amount', esc(h.amount))}
        ${ui.field('Record', esc(h.txId), true)}
        ${ui.field('Case', esc(h.flag), true)}
        ${ui.field('Held since', esc(h.frozenAt))}
        ${ui.field('Held by', esc(h.frozenBy))}
        ${ui.field('Days held', h.daysLocked)}
      </dl>
      <h3 class="stat-label mb-2">Reason</h3>
      <p class="text-sm mb-5">${esc(h.reason)}</p>
      ${h.status !== 'Released'
        ? '<div class="record-actions"><button type="button" class="btn btn-primary" data-release>Release hold</button><button type="button" class="btn btn-secondary" data-extend>Extend by 7 days</button></div>'
        : '<p class="notice">Released in this demo session.</p>'}
    </div>` : '<div class="empty">Select a hold to see its details.</div>';
}

document.querySelector('main').addEventListener('click', e => {
  const select = e.target.closest('[data-select]');
  const h = P.frozen.find(x => x.id === selectedId);
  if (select) selectedId = select.dataset.select;
  else if (e.target.closest('[data-release]')) {
    if (!confirm('Release the demo hold ' + h.id + '?')) return;
    h.status = 'Released';
  }
  else if (e.target.closest('[data-extend]')) { h.daysLocked += 7; h.status = 'Under Review'; }
  else return;
  render();
});

render();
  </script>
</body>
</html>
