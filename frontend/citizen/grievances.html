<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>PRAMAANIK · Grievances</title>
  <meta name="description" content="PRAMAANIK public fund transparency demo: sample grievances.">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="mobileHeader"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <div class="page-head">
      <div>
        <h1>Grievances</h1>
        <p>The design keeps complaints on a permissioned ledger so they cannot be quietly removed. These are sample records.</p>
      </div>
      <button type="button" class="btn btn-primary" id="newBtn">File a grievance</button>
    </div>

    <div class="card-list" id="grievanceList"></div>

    <div class="modal-overlay" id="grievanceDialog" style="display:none">
      <div class="modal-content dialog-body" role="dialog" aria-modal="true" aria-labelledby="grievanceTitle">
        <div class="dialog-head">
          <h2 id="grievanceTitle" class="text-lg">File a grievance</h2>
          <button type="button" class="icon-btn" data-close aria-label="Close"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
        <form id="grievanceForm">
          <div class="mb-4"><label class="field-label" for="gScheme">Scheme</label><select class="input-base" id="gScheme" required><option value="">Select a scheme</option></select></div>
          <div class="mb-4"><label class="field-label" for="gTitle">Title</label><input class="input-base" id="gTitle" placeholder="What went wrong, in a few words" required></div>
          <div class="mb-4"><label class="field-label" for="gDesc">Description</label><textarea class="input-base" id="gDesc" placeholder="What happened, when, and any reference numbers" required></textarea></div>
          <p class="notice mb-4">Demo only. This is not filed with any authority and disappears when you reload. Don't enter real personal details.</p>
          <button type="submit" class="btn btn-primary w-full">Add demo grievance</button>
        </form>
      </div>
    </div>
  </main>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/sidebar.js"></script>
  <script>
const P = PRAMAANIK, ui = P.ui, esc = ui.esc;
P.initPage('citizen', 'grievances');

function render() {
  document.getElementById('grievanceList').innerHTML = P.grievances.map(g => `
    <article class="panel record">
      <div class="record-head">
        <div class="min-w-0"><h2 class="text-base break-all" style="word-break:break-word">${esc(g.title)}</h2><div class="text-xs muted">${esc(g.id)} · filed ${esc(g.filedAt)}</div></div>
        ${ui.badge(g.status)}
      </div>
      <div class="text-sm font-semibold">${esc(g.scheme)}</div>
      <p class="text-sm" style="overflow-wrap:anywhere">${esc(g.description)}</p>
      <dl class="fields" style="margin-top:auto">
        ${ui.field('Filed by', esc(g.filer), true)}
        ${ui.field('Responses', g.responseCount)}
        ${ui.field('Reference', g.txHash ? esc(g.txHash) : 'Added in this session, not submitted anywhere', Boolean(g.txHash))}
      </dl>
    </article>`).join('');
}

const form = document.getElementById('grievanceForm');
ui.fillSchemes(document.getElementById('gScheme'));
ui.wireDialog('grievanceDialog', () => form.reset());
document.getElementById('newBtn').addEventListener('click', () => ui.openDialog('grievanceDialog'));
form.addEventListener('submit', e => {
  e.preventDefault();
  const session = P.auth.getSession();
  const today = new Date().toLocaleDateString('en-CA');
  P.grievances.unshift({
    id: 'GRV-' + String(P.grievances.length + 1).padStart(3, '0'),
    scheme: document.getElementById('gScheme').value,
    title: document.getElementById('gTitle').value.trim(),
    filer: session ? session.did : 'did:polygonid:citizen:demo',
    description: document.getElementById('gDesc').value.trim(),
    status: 'open', filedAt: today, lastUpdated: today, txHash: null, responseCount: 0
  });
  ui.closeDialog('grievanceDialog', () => form.reset());
  render();
});

render();
  </script>
</body>
</html>
