<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>PRAMAANIK · Look up a case</title>
  <meta name="description" content="PRAMAANIK public fund transparency demo: look up a sample anomaly case.">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="mobileHeader"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <div class="page-head">
      <div>
        <h1>Look up a case</h1>
        <p>Enter a case ID or record ID to see its sample proof status.</p>
      </div>
    </div>
    <div style="max-width:640px">
      <p class="notice mb-4">This is a lookup in sample data. No cryptographic proof is checked and no blockchain is contacted.</p>
      <form id="lookupForm" class="mb-4">
        <label class="field-label" for="lookupInput">Case ID or record ID</label>
        <div class="flex gap-3 flex-wrap">
          <input class="input-base font-mono flex-1" style="min-width:200px" id="lookupInput" placeholder="FLAG-001" autocomplete="off">
          <button type="submit" class="btn btn-primary">Look up</button>
        </div>
        <p class="text-xs muted mt-2">Try <span class="font-mono">FLAG-001</span> or <span class="font-mono">FLAG-003</span>.</p>
      </form>
      <div id="lookupResult" aria-live="polite"></div>
    </div>
  </main>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/sidebar.js"></script>
  <script>
const P = PRAMAANIK, ui = P.ui, esc = ui.esc;
P.initPage('citizen', 'verify');

document.getElementById('lookupForm').addEventListener('submit', e => {
  e.preventDefault();
  const q = document.getElementById('lookupInput').value.trim().toLowerCase();
  const out = document.getElementById('lookupResult');
  // whole IDs only: a partial or empty entry must never report a match
  const f = q && P.flags.find(x => x.id.toLowerCase() === q || x.txId.toLowerCase() === q);
  if (!f) {
    out.innerHTML = '<p class="notice notice-danger">' + (q ? 'No sample case has that ID. Enter the whole ID.' : 'Enter a case ID or record ID.') + '</p>';
    return;
  }
  out.innerHTML = `
    <article class="panel record">
      <div class="record-head">
        <div><h2 class="text-base">${esc(f.type)}</h2><div class="text-xs muted">${esc(f.id)}</div></div>
        ${f.proofVerified ? ui.badge('active', 'Marked verified') : ui.badge('pending')}
      </div>
      <p class="text-sm">${esc(f.explanation)}</p>
      ${ui.riskMeter(f.risk)}
      <dl class="fields">
        ${ui.field('Record', esc(f.txId), true)}
        ${ui.field('Model', esc(f.model), true)}
        ${ui.field('Amount', esc(f.amount))}
        ${ui.field('Scheme', esc(f.scheme))}
      </dl>
    </article>`;
});
  </script>
</body>
</html>
